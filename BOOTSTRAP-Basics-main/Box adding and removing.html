   

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Example</title>
    <style>
        .box {
            width: 100px;
            height: 100px;
            background-color: lightcoral;
            margin: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
        }
        .highlight {
            background-color: rgb(102, 227, 24);
            border: 2px solid darkgreen;
        }
        .hidden {
            display: none;
        }
    </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
</head>
<body>
    <div id="container">
        <div class="box" id="box1">Box 1</div>
        <div class="box" id="box2">Box 2</div>
    </div>
    <button id="addBoxBtn" onclick="addBox()" class="btn btn-outline-primary m-3">Add Box</button>
    <button id="toggleHighlightBtn" onclick="changeColor()" class="btn btn-outline-success m-3">Toggle Highlight on Box 1</button>
    <button id="removeLastBoxBtn" onclick="deleteBox()"  class="btn btn-outline-danger m-3">Remove Last Box</button>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
    <script>
        var container = document.getElementById("container");
        let count = 3;
        function addBox(){
            container.innerHTML += `<div class='box' id='box${count}'>Box ${count} </div>`;
            count++;
        }
        function deleteBox(){
            const container = document.getElementById("container");
            const boxes = container.getElementsByClassName("box");
            if (boxes.length > 0) {
                container.removeChild(boxes[boxes.length - 1]);
                count--;
            }
            else{
                window.alert("No Box")
            }
        }
        function changeColor(){
            var box1 = document.getElementById("box1");
            box1.classList.toggle("highlight");
        }
        document.addEventListener("keydown",function(event){
            if(event.key == "Enter" ){
                addBox();
            }
             if(event.key == "Backspace"){
                deleteBox();
            }
        })
    </script>
</body>
</html>
